name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Validate plugin manifest, MCP config, and skills
        run: python3 scripts/validate_plugin.py

      - name: Exercise static and installed MCP contract fixtures
        run: python3 -m unittest discover -s tests -v

      - name: Gate the routing and evidence fixture
        run: |
          python3 bench/e2e/score.py \
            --cases bench/e2e/cases.jsonl \
            --runs bench/e2e/runs/fixture-good.jsonl \
            --thresholds bench/e2e/thresholds.json
          if python3 bench/e2e/score.py \
            --cases bench/e2e/cases.jsonl \
            --runs bench/e2e/runs/fixture-bad.jsonl \
            --thresholds bench/e2e/thresholds.json; then
            echo "::error::intentionally bad benchmark fixture passed"
            exit 1
          fi

      - name: Shellcheck install.sh
        run: shellcheck install.sh

  validate-installed-components:
    name: Validate exact installed component schemas
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install exact BOM components and validate real tools/list schemas
        env:
          CODE_INTEL_COMPONENT_TOKEN: ${{ secrets.CODE_INTEL_COMPONENT_TOKEN }}
        run: python3 scripts/validate_real_installed.py
