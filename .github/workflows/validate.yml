name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Validate plugin manifest, MCP config, and skills
        run: python3 scripts/validate_plugin.py

      - name: Exercise static and installed MCP contract fixtures
        run: python3 -m unittest discover -s tests -v

      - name: Gate the routing and evidence fixture
        run: |
          python3 bench/e2e/score.py \
            --cases bench/e2e/cases.jsonl \
            --runs bench/e2e/runs/fixture-good.jsonl \
            --thresholds bench/e2e/thresholds.json
          if python3 bench/e2e/score.py \
            --cases bench/e2e/cases.jsonl \
            --runs bench/e2e/runs/fixture-bad.jsonl \
            --thresholds bench/e2e/thresholds.json; then
            echo "::error::intentionally bad benchmark fixture passed"
            exit 1
          fi

      - name: Shellcheck install.sh
        run: shellcheck install.sh

      - name: Parse install.ps1 with PowerShell AST
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "install.ps1"),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw "install.ps1 failed PowerShell AST parsing"
          }

  merge-gate:
    name: merge-gate
    if: ${{ always() }}
    needs: [validate]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every deterministic validation dependency
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          test "$VALIDATE_RESULT" = "success"
