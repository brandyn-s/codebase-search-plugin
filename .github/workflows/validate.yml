name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Validate plugin manifest, MCP config, and skills
        run: python3 scripts/validate_plugin.py

      - name: Exercise static and installed MCP contract fixtures
        run: python3 -m unittest discover -s tests -v

      - name: Gate the routing and evidence fixture
        run: |
          python3 bench/e2e/score.py \
            --cases bench/e2e/cases.jsonl \
            --runs bench/e2e/runs/fixture-good.jsonl \
            --thresholds bench/e2e/thresholds.json
          if python3 bench/e2e/score.py \
            --cases bench/e2e/cases.jsonl \
            --runs bench/e2e/runs/fixture-bad.jsonl \
            --thresholds bench/e2e/thresholds.json; then
            echo "::error::intentionally bad benchmark fixture passed"
            exit 1
          fi

      - name: Gate the five-arm comparison instrument
        env:
          COMPARE_CANARY_WRITE_PATH: ${{ runner.temp }}/compare-host-write-canary
          COMPARE_SECRET_CANARY: fixture-host-secret-canary-do-not-emit
        run: |
          python3 bench/compare/build_fixture.py \
            --pin bench/compare/pins/fixture-public-n7.json \
            --good bench/compare/fixtures/five-arm-good.json \
            --bad bench/compare/fixtures/five-arm-bad.json \
            --check
          python3 bench/compare/run.py \
            --cases bench/compare/pins/fixture-public-n7.json \
            --arms corpus,native,code-search,code-graph,composed \
            --replicates 1 \
            --top-k 10 \
            --max-tool-calls 20 \
            --evidence-token-budget 64000 \
            --context-token-budget 128000 \
            --wall-timeout 600 \
            --run-dir "$RUNNER_TEMP/compare-good" \
            --mode fixture \
            --fixture-results bench/compare/fixtures/five-arm-good.json
          python3 bench/compare/score.py \
            --run-dir "$RUNNER_TEMP/compare-good" \
            --intent-to-treat \
            --bootstrap 10000 \
            --seed 42 \
            --holm-primary composed-corpus,composed-native \
            --thresholds bench/compare/thresholds.json
          python3 bench/compare/run.py \
            --cases bench/compare/pins/fixture-public-n7.json \
            --arms corpus,native,code-search,code-graph,composed \
            --replicates 1 \
            --top-k 10 \
            --max-tool-calls 20 \
            --evidence-token-budget 64000 \
            --context-token-budget 128000 \
            --wall-timeout 600 \
            --run-dir "$RUNNER_TEMP/compare-bad" \
            --mode fixture \
            --fixture-results bench/compare/fixtures/five-arm-bad.json
          if python3 bench/compare/score.py \
            --run-dir "$RUNNER_TEMP/compare-bad" \
            --intent-to-treat \
            --bootstrap 10000 \
            --seed 42 \
            --holm-primary composed-corpus,composed-native \
            --thresholds bench/compare/thresholds.json; then
            echo "::error::intentionally bad five-arm fixture passed"
            exit 1
          fi

      - name: Export and verify portable proof packet
        run: |
          python3 scripts/export_proof.py export bench/e2e/proof-fixture-v1.json --output-dir "$RUNNER_TEMP/proof-packet"
          python3 scripts/export_proof.py verify "$RUNNER_TEMP/proof-packet"

      - name: Publish verified proof packet
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-intelligence-proof-packet
          path: ${{ runner.temp }}/proof-packet
          if-no-files-found: error
          retention-days: 30

      - name: Shellcheck install.sh
        run: shellcheck install.sh

      - name: Parse install.ps1 with PowerShell AST
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "install.ps1"),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw "install.ps1 failed PowerShell AST parsing"
          }

  live-control-plane:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANTHROPIC_API_KEY: ""
      ANTHROPIC_AUTH_TOKEN: ""
      CLAUDE_CODE_USE_BEDROCK: ""
      CLAUDE_CODE_USE_VERTEX: ""
      VOYAGE_API_KEY: ""
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_SESSION_TOKEN: ""
      AWS_REGION: ""
      AWS_DEFAULT_REGION: ""
      GOOGLE_APPLICATION_CREDENTIALS: ""
      ANTHROPIC_VERTEX_PROJECT_ID: ""
      CLOUD_ML_REGION: ""
      GH_TOKEN: ""
      GITHUB_TOKEN: ""
    steps:
      - name: Block non-GitHub network egress
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443

      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Prove the zero-cost live control plane remains inert
        run: |
          python3 -m unittest \
            tests.test_compare_live_runtime \
            tests.test_compare_provenance \
            tests.test_compare_run.ComparisonRunTests.test_live_preflight_without_authorities_reports_every_zero_cost_blocker \
            tests.test_compare_run.ComparisonRunTests.test_live_preflight_rejects_self_attested_and_unverified_signed_authorities \
            tests.test_compare_run.ComparisonRunTests.test_live_preflight_rejects_a_symlink_swapped_between_mkdir_and_open \
            tests.test_compare_run.ComparisonRunTests.test_live_preflight_rejects_a_path_swap_immediately_after_directory_open \
            tests.test_compare_run.ComparisonRunTests.test_live_preflight_rejects_a_path_swap_immediately_before_publication \
            tests.test_compare_run.ComparisonRunTests.test_live_preflight_never_clobbers_a_diagnostic_won_by_a_racer \
            tests.test_compare_run.ComparisonRunTests.test_live_preflight_removes_only_its_diagnostic_when_inventory_races_link \
            tests.test_compare_run.ComparisonRunTests.test_live_preflight_rejects_unsupported_fd_capabilities_before_writing \
            tests.test_compare_run.ComparisonRunTests.test_live_preflight_closes_directory_fd_when_evidence_hashing_fails \
            tests.test_compare_run.ComparisonRunTests.test_live_preflight_rejects_a_stale_manifest_without_writing \
            tests.test_compare_run.ComparisonRunTests.test_live_preflight_rejects_a_hardlinked_diagnostic_without_replacing_it \
            tests.test_compare_run.ComparisonRunTests.test_live_preflight_rejects_every_unexpected_preexisting_entry \
            tests.test_compare_run.ComparisonRunTests.test_live_preflight_rejects_unsafe_diagnostic_entry_types \
            tests.test_compare_run.ComparisonRunTests.test_live_preflight_normalizes_a_non_directory_run_path \
            tests.test_compare_run.ComparisonRunTests.test_live_preflight_never_overwrites_a_mismatched_existing_diagnostic \
            tests.test_compare_run.ComparisonRunTests.test_live_preflight_normalizes_an_unwritable_diagnostic_path \
            tests.test_compare_run.ComparisonRunTests.test_live_preflight_cleans_an_unsafe_new_temporary_diagnostic \
            tests.test_compare_run.ComparisonRunTests.test_live_preflight_rejects_inventory_race_during_existing_snapshot \
            tests.test_compare_run.ComparisonRunTests.test_live_preflight_reuses_its_only_exact_prior_diagnostic_without_writing \
            tests.test_compare_run.ComparisonRunTests.test_live_preflight_refuses_a_symlink_artifact_directory \
            tests.test_compare_documentation

  merge-gate:
    name: merge-gate
    if: ${{ always() }}
    needs: [validate, live-control-plane]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Require every deterministic validation dependency
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          LIVE_CONTROL_PLANE_RESULT: ${{ needs.live-control-plane.result }}
        run: |
          test "$VALIDATE_RESULT" = "success"
          test "$LIVE_CONTROL_PLANE_RESULT" = "success"
