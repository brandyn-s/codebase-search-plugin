name: Trusted Component Promotion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trusted-component-promotion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-installed-components:
    name: Validate exact installed components and live readiness
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact candidate and capture trusted evidence
        env:
          CODE_INTEL_COMPONENT_TOKEN: ${{ secrets.CODE_INTEL_COMPONENT_TOKEN }}
        run: >-
          python3 scripts/validate_real_installed.py
          --component-bom component-bom.json
          --contract-evidence-output
          "$RUNNER_TEMP/code-intel-ready-validation/contracts"
          --readiness-evidence-output
          "$RUNNER_TEMP/code-intel-ready-validation/readiness-evidence.json"

      - name: Upload trusted readiness evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-intel-ready-validation
          path: ${{ runner.temp }}/code-intel-ready-validation
          if-no-files-found: error
          retention-days: 30
