name: Trusted Component Promotion
# Post-merge trusted validation installs the exact component releases pinned in
# component-bom.json and captures readiness evidence. It uses no repository
# secret: the first step gates the job on every pin living in a publicly
# reachable brandyn-s/ repository, and the validator receives only the
# workflow's ephemeral read-only github.token so tag resolution and asset
# downloads are not subject to the unauthenticated REST rate limit. Without a
# token the validator falls back to the public REST API automatically.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trusted-component-promotion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-installed-components:
    name: Validate exact installed components and live readiness
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Gate on publicly reachable component pins
        id: gate
        run: python3 scripts/promotion_gate.py --component-bom component-bom.json

      - name: Set up Python 3.12
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact candidate and capture trusted evidence
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/validate_real_installed.py
          --component-bom component-bom.json
          --contract-evidence-output
          "$RUNNER_TEMP/code-intel-ready-validation/contracts"
          --readiness-evidence-output
          "$RUNNER_TEMP/code-intel-ready-validation/readiness-evidence.json"

      - name: Upload trusted readiness evidence
        if: steps.gate.outputs.run == 'true' && success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-intel-ready-validation
          path: ${{ runner.temp }}/code-intel-ready-validation
          if-no-files-found: error
          retention-days: 30
